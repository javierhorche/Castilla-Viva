<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fondo crema — identidad visual Castilla Viva -->
  <rect width="1200" height="630" fill="#f0e9dc"/>

  <!-- Logo: CASTILLA (eyebrow monospace) -->
  <text x="600" y="238"
    font-family="'Courier New', Courier, monospace"
    font-size="24"
    font-weight="500"
    letter-spacing="10"
    text-anchor="middle"
    fill="#14110e">CASTILLA</text>

  <!-- Regla bajo CASTILLA — igual que border-bottom del .cv-mark -->
  <line x1="506" y1="252" x2="694" y2="252" stroke="#14110e" stroke-width="1"/>

  <!-- Logo: viva. (serif itálica, punto carmesí) -->
  <text x="600" y="436"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="196"
    font-weight="400"
    letter-spacing="-10"
    text-anchor="middle"
    fill="#14110e">viva<tspan fill="#8a1e2c">.</tspan></text>

  <!-- Tagline / dominio -->
  <text x="600" y="568"
    font-family="'Courier New', Courier, monospace"
    font-size="15"
    letter-spacing="5"
    text-anchor="middle"
    fill="#14110e"
    opacity="0.38">RAI&#769;Z Y FUTURO · CASTILLAVIVA.ORG</text>
</svg>
